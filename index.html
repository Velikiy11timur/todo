<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>To do list product by Velikiy11timur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container border1">
     <div class="nameApp border1">
        <h1 class="todo_title">To Do List</h1>
        <h5 class="productor">prod. by Velikiy11timur</h5>
     </div>
    
    <div class="controls">
      <div class="select-all-div">
        <input 
          class="selectAll"
          type="checkbox"
        >
        <div class="selectAllTasksText">
          Select all
        </div>
      </div>
      <input class="todoText" type="text" placeholder="New task">
      <button class="addButton">Add</button>
      <button class="deleteSelectedButton">Delete</button> 
    </div>
    <div class="filters"></div>
    <div class="content border1"></div>
    <div class="paginationContainer"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.18.1/lodash.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
