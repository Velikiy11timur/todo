<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>To do list product by Velikiy11timur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo" data-js-todo>
        <h1 class="todo_title">To Do List</h1>
        <form class="todo_form" data-js-todo-new-task-form>
            <div class="todo_field field">
                <label 
                class="field_label" 
                for="new-task">
                New task title
                </label>
                <input 
                class="field_input" 
                type="text" 
                id="new-task"
                placeholder=" "
                autocomplete="off"
                data-js-todo-new-task-input
                /><!-- //выключить браузерное автодополнение -->
            </div>
            <button class="button" type="submit">Add</button>
        </form>
        <form class="todo_form" data-js-todo-search-task-form>
            <div class="todo_field field">
                <label 
                class="field_label" 
                for="search-task">
                Search task
                </label>
                <input 
                class="field_input" 
                type="search"
                id="search-task"
                placeholder=" "
                autocomplete="off"
                data-js-todo-search-task-input
                /><!-- //выключить браузерное автодополнение -->
            </div>
        </form>
        <div class="todo_info">
            <div class="todo_total-tasks">
                Total tasks: <span data-js-todo-total-tasks>0</span>
            </div>
            <button 
                class="todo_delete-all-button" 
                type="button"
                data-js-todo-delete-all-button
            >
            Delete All
            </button>
        </div>
        <ul class="todo_list" data-js-todo-list>
            <li class="todo_item todo-item" data-js-todo-item>
                <input
                class="todo-item_checkbox"
                id="todo-1"
                type="checkbox"
                data-js-todo-item-checkbox
                />
                <label 
                    class="todo-item_label"
                    for="todo-1"
                    data-js-todo-item-label
                    >
                Todo 1
                </label>
                <button 
                    class="todo-item_delete-button"
                    type="button"
                    aria-label="Delete"
                    title="Delete"
                    data-js-todo-item-delete-button
                > <!-- aria-label для обеспечения доступности?? title для удобного UX?? -->
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </button>
            </li>    <!-- что такое отдельный бэм блок? --> 
            <li class="todo_item todo-item" data-js-todo-item>
                <input
                class="todo-item_checkbox"
                id="todo-1"
                type="checkbox"
                data-js-todo-item-checkbox
                />
                <label 
                    class="todo-item_label"
                    for="todo-1"
                    data-js-todo-item-label
                    >
                Todo 1
                </label>
                <button 
                    class="todo-item_delete-button"
                    type="button"
                    aria-label="Delete"
                    title="Delete"
                    data-js-todo-item-delete-button=""
                > <!-- aria-label для обеспечения доступности?? title для удобного UX?? -->
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 5L5 15M5 5L15 15" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </button>
            </li>    <!-- что такое отдельный бэм блок? --> 
        </ul>
        <div class="todo_empty-massage" data-js-todo-empty-message></div>
    </div>
 <script src="script.js"> type="module"</script> <!--что значит type="module"?? Спросить у Илюхи -->
</body>
</html>
